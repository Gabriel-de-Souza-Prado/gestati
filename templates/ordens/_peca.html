<div class="os-piece-row" data-formset-row>
{% for field in linha %}{% if field.name == 'DELETE' %}<div class="field row-remove-field">{{ field.as_hidden }}<button class="button remove-row-button" type="button" data-remove-row aria-label="Remover linha de componente">Remover linha</button></div>{% elif field.is_hidden %}{{ field }}{% else %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endif %}{% endfor %}{{ linha.non_field_errors }}
</div>
