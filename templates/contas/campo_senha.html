<div class="field password-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>
<div class="password-input">{{ field }}<button class="password-toggle" type="button" hidden data-password-toggle="{{ field.id_for_label }}" data-password-label="{{ field.label|lower }}" aria-label="Mostrar {{ field.label|lower }}" title="Mostrar {{ field.label|lower }}" aria-controls="{{ field.id_for_label }}" aria-pressed="false"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 5.1 12 5c6.5 0 10 7 10 7a21 21 0 0 1-3.1 3.9M6.2 6.2A22 22 0 0 0 2 12s3.5 7 10 7a11 11 0 0 0 5.1-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></div>
{% if field.errors %}<div class="form-errors" role="alert">{{ field.errors }}</div>{% endif %}{% if field.help_text %}<div class="password-help">{{ field.help_text }}</div>{% endif %}</div>
