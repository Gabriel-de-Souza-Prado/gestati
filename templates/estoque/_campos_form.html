
{% for field in form %}
{% if field.is_hidden %}{{ field }}{% else %}
<div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required and field.name != 'capacidade' and field.name != 'unidade_capacidade' %} <span class="optional-label">(opcional)</span>{% endif %}</label>
    {{ field }}
    {% if field.errors %}<div class="form-errors" role="alert">{{ field.errors }}</div>{% endif %}
    {% if field.help_text %}<div class="help-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
</div>
{% endif %}
{% endfor %}
