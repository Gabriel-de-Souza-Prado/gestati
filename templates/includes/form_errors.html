{% if form.non_field_errors or form.hidden_fields %}
{% if form.non_field_errors %}<div class="form-errors form-error-summary" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for hidden in form.hidden_fields %}{% if hidden.errors %}<div class="form-errors form-error-summary" role="alert">{{ hidden.errors }}</div>{% endif %}{% endfor %}
{% endif %}
