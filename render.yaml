# Demonstração com dados fictícios. O PostgreSQL gratuito expira em 30 dias.
# Não aplicar este Blueprint a um ambiente com dados municipais reais.
services:
  - type: web
    name: gestati-demo
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    autoDeployTrigger: "off"
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: GESTATI_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gestati-demo-db
          property: connectionString
      - key: GESTATI_BOOTSTRAP_ADMIN
        value: "1"
      - key: GESTATI_ADMIN_USERNAME
        sync: false
      - key: GESTATI_ADMIN_PASSWORD
        sync: false
databases:
  - name: gestati-demo-db
    region: oregon
    plan: free
    postgresMajorVersion: "18"
    databaseName: gestati_demo
    user: gestati_demo
    # Apenas os serviços na rede interna poderão conectar ao banco.
    ipAllowList: []
